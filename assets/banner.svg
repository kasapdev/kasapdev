<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">kasapdev</title>
  <desc id="d">Backend and full-stack developer. Game-server systems, hosting infrastructure and zero-dependency libraries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e1c"/>
      <stop offset="0.55" stop-color="#171833"/>
      <stop offset="1" stop-color="#241a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#a855f7" stop-opacity="0.38"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- drifting glow orbs -->
    <circle r="260" fill="url(#g1)">
      <animate attributeName="cx" values="180;330;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;150;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="230" fill="url(#g2)">
      <animate attributeName="cx" values="1050;900;1050" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;170;260" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle r="210" fill="url(#g3)">
      <animate attributeName="cx" values="820;980;820" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;110;40" dur="19s" repeatCount="indefinite"/>
    </circle>

    <!-- window chrome -->
    <circle cx="44" cy="40" r="6.5" fill="#ff5f57"/>
    <circle cx="66" cy="40" r="6.5" fill="#febc2e"/>
    <circle cx="88" cy="40" r="6.5" fill="#28c840"/>
    <text x="1156" y="45" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b8fb8">~/kasapdev</text>

    <!-- prompt -->
    <text x="60" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#8b8fb8">
      <tspan fill="#22d3ee">kasapdev</tspan><tspan>@berilis</tspan><tspan fill="#a78bfa">:~$</tspan><tspan fill="#e5e7ff"> whoami</tspan>
    </text>

    <!-- name -->
    <text x="56" y="196" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#accent)">kasapdev</text>

    <!-- rotating role line -->
    <g font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="500" fill="#e5e7ff">
      <text x="60" y="246" opacity="1">Backend &amp; Full-Stack Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="246" opacity="0">Game-server systems · MTA &amp; FiveM
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="3.5s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="246" opacity="0">Zero-dependency libraries · Rust · Go · PHP · Java
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="7s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="246" opacity="0">Hosting &amp; infrastructure · VDS · PM2 · systemd
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="10.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- accent bar -->
    <rect x="60" y="268" width="120" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="120;260;120" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- stack chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" text-anchor="middle">
      <g transform="translate(860,244)">
        <rect width="64" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="32" y="20" fill="#c7c9ff">PHP</text>
      </g>
      <g transform="translate(934,244)">
        <rect width="64" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="32" y="20" fill="#c7c9ff">TS</text>
      </g>
      <g transform="translate(1008,244)">
        <rect width="64" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="32" y="20" fill="#c7c9ff">Rust</text>
      </g>
      <g transform="translate(1082,244)">
        <rect width="64" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="32" y="20" fill="#c7c9ff">Go</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
